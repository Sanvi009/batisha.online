<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders — Merchant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f5f7fa;
      color: #1a1f36;
      padding-bottom: 80px;
    }
    .container { max-width: 1000px; margin: 0 auto; padding: 1.5rem; }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      background: white;
      border-bottom: 1px solid #e8edf2;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .top-nav .brand {
      font-weight: 700;
      font-size: 1.2rem;
      color: #1a1f36;
    }
    .top-nav .brand span { color: #1f8b4c; }
    .top-nav .nav-links {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }
    .top-nav .nav-links a {
      text-decoration: none;
      color: #4b5f6b;
      font-weight: 500;
      font-size: 0.9rem;
      transition: 0.15s;
    }
    .top-nav .nav-links a:hover { color: #1a1f36; }
    .top-nav .nav-links a.active { color: #1f8b4c; }
    .top-nav .logout-btn {
      padding: 0.3rem 1rem;
      background: #fef2f2;
      color: #991b1b;
      border: none;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .page-header { margin: 1.5rem 0 1rem; }
    .page-header h1 { font-size: 1.6rem; font-weight: 700; }
    .page-header p { color: #6b7a86; }

    .order-card {
      background: white;
      border-radius: 12px;
      padding: 1rem 1.2rem;
      border: 1px solid #e8edf2;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
      margin-bottom: 1rem;
    }
    .order-card .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .order-card .order-id { font-weight: 700; font-size: 0.9rem; }
    .order-card .customer { color: #6b7a86; font-size: 0.8rem; }
    .order-card .status-badge {
      padding: 0.1rem 0.7rem;
      border-radius: 30px;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .status-pending { background: #fefce8; color: #a16207; border: 1px solid #fde68a; }
    .status-processing { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
    .status-packed { background: #f0fdf4; color: #0f6e3a; border: 1px solid #bbf7d0; }
    .status-ready { background: #f0fdf4; color: #0f6e3a; border: 1px solid #bbf7d0; }
    .status-out_for_delivery { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
    .status-delivered { background: #dcfce7; color: #16a34a; border: 1px solid #bbf7d0; }
    .status-cancelled { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }

    .order-card .body {
      margin-top: 0.8rem;
      padding-top: 0.8rem;
      border-top: 1px solid #f0f3f7;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .order-card .body .items { font-size: 0.8rem; color: #1a1f36; }
    .order-card .body .items .item {
      display: flex;
      justify-content: space-between;
      padding: 0.15rem 0;
    }
    .order-card .body .total {
      font-weight: 700;
      font-size: 1rem;
      margin-top: 0.3rem;
    }
    .order-card .body .special-note {
      font-size: 0.75rem;
      color: #6b7a86;
      background: #f8fbf9;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
    }

    .order-card .actions {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.8rem;
      flex-wrap: wrap;
    }
    .order-card .actions select {
      padding: 0.2rem 0.5rem;
      border: 1px solid #e4ece8;
      border-radius: 8px;
      font-size: 0.75rem;
      background: white;
      font-family: inherit;
    }
    .order-card .actions button {
      padding: 0.2rem 0.8rem;
      border: none;
      border-radius: 30px;
      font-size: 0.65rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }
    .btn-update { background: #1f8b4c; color: white; }
    .btn-update:hover { background: #0f6e3a; }
    .btn-delete { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .btn-delete:hover { background: #fee2e2; }

    .loader { text-align: center; padding: 2rem; color: #6b7a86; }
    .loader .spinner {
      display: inline-block;
      width: 24px; height: 24px;
      border: 3px solid #e2ebe6;
      border-top-color: #1f8b4c;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty { text-align: center; padding: 2rem; color: #6b7a86; }

    .bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: white;
      border-top: 1px solid #e8edf2;
      padding: 0.5rem 0;
      justify-content: space-around;
      z-index: 200;
    }
    .bottom-nav a {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #4b5f6b;
      font-size: 0.6rem;
      font-weight: 500;
      gap: 0.1rem;
    }
    .bottom-nav a .icon { font-size: 1.2rem; }
    .bottom-nav a.active { color: #1f8b4c; }

    @media (max-width: 768px) {
      .top-nav .nav-links { display: none; }
      .bottom-nav { display: flex; }
      .container { padding: 1rem; }
    }
  </style>
</head>
<body>
  <nav class="top-nav">
    <div class="brand">🛍️ <span>Merchant</span></div>
    <div class="nav-links">
      <a href="/merchant/dashboard/">Dashboard</a>
      <a href="/merchant/orders/" class="active">Orders</a>
      <a href="/merchant/products/">Products</a>
      <a href="/merchant/add-product/">Add Product</a>
      <a href="/merchant/offers/">Offers</a>
      <a href="/merchant/profile/">Profile</a>
    </div>
    <button class="logout-btn" id="logoutBtn">Logout</button>
  </nav>

  <div class="container">
    <div class="page-header">
      <h1>📦 Orders</h1>
      <p>Manage incoming orders from your shop</p>
    </div>

    <div id="ordersList">
      <div class="loader">
        <div class="spinner"></div>
        <p>Loading orders...</p>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="/merchant/dashboard/">
      <span class="icon">📊</span> Dashboard
    </a>
    <a href="/merchant/orders/" class="active">
      <span class="icon">📦</span> Orders
    </a>
    <a href="/merchant/products/">
      <span class="icon">📋</span> Products
    </a>
    <a href="/merchant/profile/">
      <span class="icon">👤</span> Profile
    </a>
  </div>

  <script>
    const token = localStorage.getItem('merchant_token');
    if (!token) {
      window.location.href = '/merchant/';
    }

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('merchant_token');
      window.location.href = '/merchant/';
    });

    async function loadOrders() {
      try {
        const res = await fetch('/api/orders?action=shop-orders', {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!res.ok) {
          if (res.status === 401 || res.status === 403) {
            localStorage.removeItem('merchant_token');
            window.location.href = '/merchant/';
            return;
          }
          throw new Error('Failed to load orders');
        }

        const data = await res.json();
        const orders = data.orders || [];

        const container = document.getElementById('ordersList');
        if (orders.length === 0) {
          container.innerHTML = `<div class="empty">📭 No orders yet.</div>`;
          return;
        }

        container.innerHTML = '';
        orders.forEach(order => {
          const card = document.createElement('div');
          card.className = 'order-card';
          card.dataset.id = order.id;

          const statusClass = `status-${order.status}`;
          const customer = order.profiles || { full_name: 'Unknown', phone: '—' };

          let itemsHtml = '';
          if (order.order_items && order.order_items.length > 0) {
            order.order_items.forEach(item => {
              const productTitle = item.products?.title || item.offers?.title || 'Unknown';
              const imageUrl = item.products?.image_url || item.offers?.image_url || '';
              itemsHtml += `
                <div class="item">
                  <span>${productTitle} × ${item.quantity}</span>
                  <span>৳${parseFloat(item.price_at_time).toFixed(2)}</span>
                </div>
              `;
            });
          }

          const note = order.special_note ? `<div class="special-note">📝 ${order.special_note}</div>` : '';

          card.innerHTML = `
            <div class="header">
              <span class="order-id">#${order.id}</span>
              <span class="customer">👤 ${customer.full_name} • ${customer.phone}</span>
              <span class="status-badge ${statusClass}">${order.status.replace(/_/g, ' ')}</span>
            </div>
            <div class="body">
              <div class="items">${itemsHtml}</div>
              ${note}
              <div class="total">Total: ৳${parseFloat(order.total_price).toFixed(2)}</div>
            </div>
            <div class="actions">
              <select id="statusSelect_${order.id}">
                <option value="processing" ${order.status === 'processing' ? 'selected' : ''}>Processing</option>
                <option value="packed" ${order.status === 'packed' ? 'selected' : ''}>Packed</option>
                <option value="ready" ${order.status === 'ready' ? 'selected' : ''}>Ready</option>
                <option value="out_for_delivery" ${order.status === 'out_for_delivery' ? 'selected' : ''}>Out for Delivery</option>
                <option value="delivered" ${order.status === 'delivered' ? 'selected' : ''}>Delivered</option>
                <option value="cancelled" ${order.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
              </select>
              <button class="btn-update" data-orderid="${order.id}">Update Status</button>
              <button class="btn-delete" data-orderid="${order.id}">Delete</button>
            </div>
          `;

          container.appendChild(card);
        });

        // Attach event listeners
        document.querySelectorAll('.btn-update').forEach(btn => {
          btn.addEventListener('click', async () => {
            const orderId = btn.dataset.orderid;
            const select = document.getElementById(`statusSelect_${orderId}`);
            const newStatus = select.value;

            try {
              const res = await fetch('/api/orders?action=update-status', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ orderId, status: newStatus })
              });

              if (res.ok) {
                loadOrders();
              } else {
                const data = await res.json();
                alert(data.error || 'Failed to update status');
              }
            } catch (err) {
              alert('Error updating status');
            }
          });
        });

        document.querySelectorAll('.btn-delete').forEach(btn => {
          btn.addEventListener('click', async () => {
            if (!confirm('Delete this order permanently?')) return;
            const orderId = btn.dataset.orderid;

            try {
              const res = await fetch('/api/orders?action=delete', {
                method: 'DELETE',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ orderId })
              });

              if (res.ok) {
                loadOrders();
              } else {
                const data = await res.json();
                alert(data.error || 'Failed to delete order');
              }
            } catch (err) {
              alert('Error deleting order');
            }
          });
        });

      } catch (err) {
        console.error('Orders error:', err);
        document.getElementById('ordersList').innerHTML = `<div class="empty">⚠️ Error loading orders.</div>`;
      }
    }

    loadOrders();
  </script>
</body>
</html>
