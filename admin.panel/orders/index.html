<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f5f7fa;
      color: #1a1f36;
      padding-bottom: 80px;
    }
    .container { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      background: white;
      border-bottom: 1px solid #e8edf2;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .top-nav .brand {
      font-weight: 700;
      font-size: 1.2rem;
      color: #1a1f36;
    }
    .top-nav .brand span { color: #1f8b4c; }
    .top-nav .nav-links {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }
    .top-nav .nav-links a {
      text-decoration: none;
      color: #4b5f6b;
      font-weight: 500;
      font-size: 0.9rem;
      transition: 0.15s;
    }
    .top-nav .nav-links a:hover { color: #1a1f36; }
    .top-nav .nav-links a.active { color: #1f8b4c; }
    .top-nav .logout-btn {
      padding: 0.3rem 1rem;
      background: #fef2f2;
      color: #991b1b;
      border: none;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .page-header { margin: 1.5rem 0 1rem; }
    .page-header h1 { font-size: 1.6rem; font-weight: 700; }
    .page-header p { color: #6b7a86; }

    .order-card {
      background: white;
      border-radius: 12px;
      padding: 1rem 1.2rem;
      border: 1px solid #e8edf2;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
      margin-bottom: 1rem;
    }
    .order-card .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .order-card .order-id { font-weight: 700; font-size: 0.9rem; }
    .order-card .customer { color: #6b7a86; font-size: 0.8rem; }
    .order-card .shop { color: #1f8b4c; font-weight: 600; font-size: 0.8rem; }
    .order-card .status-badge {
      padding: 0.1rem 0.7rem;
      border-radius: 30px;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .status-pending { background: #fefce8; color: #a16207; border: 1px solid #fde68a; }
    .status-processing { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
    .status-packed { background: #f0fdf4; color: #0f6e3a; border: 1px solid #bbf7d0; }
    .status-ready { background: #f0fdf4; color: #0f6e3a; border: 1px solid #bbf7d0; }
    .status-out_for_delivery { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
    .status-delivered { background: #dcfce7; color: #16a34a; border: 1px solid #bbf7d0; }
    .status-cancelled { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }

    .order-card .body {
      margin-top: 0.8rem;
      padding-top: 0.8rem;
      border-top: 1px solid #f0f3f7;
    }
    .order-card .body .total {
      font-weight: 700;
      font-size: 1rem;
      color: #1f8b4c;
    }
    .order-card .body .items {
      font-size: 0.8rem;
      color: #6b7a86;
      margin-top: 0.2rem;
    }
    .order-card .body .note {
      font-size: 0.75rem;
      color: #6b7a86;
      background: #f8fbf9;
      padding: 0.3rem 0.8rem;
      border-radius: 8px;
      margin-top: 0.3rem;
    }

    .loader { text-align: center; padding: 2rem; color: #6b7a86; }
    .loader .spinner {
      display: inline-block;
      width: 24px; height: 24px;
      border: 3px solid #e2ebe6;
      border-top-color: #1f8b4c;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty { text-align: center; padding: 2rem; color: #6b7a86; }

    .load-more {
      text-align: center;
      padding: 1rem 0;
    }
    .load-more button {
      padding: 0.4rem 1.2rem;
      background: #f3f6f8;
      border: 1px solid #e4eaf0;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.75rem;
      cursor: pointer;
      transition: 0.15s;
    }
    .load-more button:hover { background: #e8edf2; }
    .load-more button:disabled { opacity: 0.5; cursor: not-allowed; }

    .bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: white;
      border-top: 1px solid #e8edf2;
      padding: 0.5rem 0;
      justify-content: space-around;
      z-index: 200;
    }
    .bottom-nav a {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #4b5f6b;
      font-size: 0.6rem;
      font-weight: 500;
      gap: 0.1rem;
    }
    .bottom-nav a .icon { font-size: 1.2rem; }
    .bottom-nav a.active { color: #1f8b4c; }

    @media (max-width: 768px) {
      .top-nav .nav-links { display: none; }
      .bottom-nav { display: flex; }
      .container { padding: 1rem; }
    }
  </style>
</head>
<body>
  <nav class="top-nav">
    <div class="brand">📊 <span>Admin</span></div>
    <div class="nav-links">
      <a href="/admin.panel/dashboard/">Dashboard</a>
      <a href="/admin.panel/users/">Users</a>
      <a href="/admin.panel/merchants/">Merchants</a>
      <a href="/admin.panel/orders/" class="active">Orders</a>
      <a href="/admin.panel/offers/">Offers</a>
    </div>
    <button class="logout-btn" id="logoutBtn">Logout</button>
  </nav>

  <div class="container">
    <div class="page-header">
      <h1>📦 All Orders</h1>
      <p>View every order placed on the platform</p>
    </div>

    <div id="ordersList">
      <div class="loader">
        <div class="spinner"></div>
        <p>Loading orders...</p>
      </div>
    </div>

    <div class="load-more" id="loadMoreWrap" style="display:none;">
      <button id="loadMoreBtn">Load More</button>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="/admin.panel/dashboard/"><span class="icon">📊</span> Dashboard</a>
    <a href="/admin.panel/users/"><span class="icon">👤</span> Users</a>
    <a href="/admin.panel/merchants/"><span class="icon">🏪</span> Merchants</a>
    <a href="/admin.panel/orders/" class="active"><span class="icon">📦</span> Orders</a>
  </div>

  <script>
    const token = localStorage.getItem('admin_token');
    if (!token) {
      window.location.href = '/admin.panel/';
    }

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('admin_token');
      window.location.href = '/admin.panel/';
    });

    let offset = 0;
    const limit = 20;
    let hasMore = true;
    let loading = false;

    async function loadOrders(reset = false) {
      if (loading || (!hasMore && !reset)) return;
      loading = true;
      if (reset) {
        offset = 0;
        hasMore = true;
        document.getElementById('ordersList').innerHTML = `
          <div class="loader">
            <div class="spinner"></div>
            <p>Loading orders...</p>
          </div>
        `;
        document.getElementById('loadMoreWrap').style.display = 'none';
      }

      try {
        const res = await fetch(`/api/admin?action=orders&limit=${limit}&offset=${offset}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!res.ok) {
          if (res.status === 401 || res.status === 403) {
            localStorage.removeItem('admin_token');
            window.location.href = '/admin.panel/';
            return;
          }
          throw new Error('Failed to load orders');
        }

        const data = await res.json();
        const orders = data.orders || [];

        if (reset) {
          document.getElementById('ordersList').innerHTML = '';
        }

        if (orders.length === 0 && reset) {
          document.getElementById('ordersList').innerHTML = `<div class="empty">📭 No orders found.</div>`;
          document.getElementById('loadMoreWrap').style.display = 'none';
          loading = false;
          return;
        }

        orders.forEach(o => {
          const card = document.createElement('div');
          card.className = 'order-card';

          const statusClass = `status-${o.status}`;
          const customer = o.profiles || { full_name: 'Unknown', phone: '—' };
          const shop = o.shops || { shop_name: 'Unknown' };

          let itemsHtml = '';
          if (o.order_items && o.order_items.length > 0) {
            itemsHtml = o.order_items.map(item => {
              const name = item.products?.title || item.offers?.title || 'Unknown';
              return `${name} × ${item.quantity}`;
            }).join(', ');
          }

          const note = o.special_note ? `<div class="note">📝 ${o.special_note}</div>` : '';

          card.innerHTML = `
            <div class="header">
              <span class="order-id">#${o.id}</span>
              <span class="customer">👤 ${customer.full_name} • ${customer.phone}</span>
              <span class="shop">🏪 ${shop.shop_name}</span>
              <span class="status-badge ${statusClass}">${o.status.replace(/_/g, ' ')}</span>
            </div>
            <div class="body">
              <div class="items">${itemsHtml || 'No items'}</div>
              ${note}
              <div class="total">Total: ৳${parseFloat(o.total_price).toFixed(2)}</div>
            </div>
          `;

          document.getElementById('ordersList').appendChild(card);
        });

        hasMore = data.hasMore;
        offset += orders.length;
        document.getElementById('loadMoreWrap').style.display = hasMore ? 'block' : 'none';

      } catch (err) {
        console.error(err);
        if (reset) {
          document.getElementById('ordersList').innerHTML = `<div class="empty">⚠️ Error loading orders.</div>`;
        }
      }

      loading = false;
    }

    // ===== Load More =====
    document.getElementById('loadMoreBtn').addEventListener('click', () => loadOrders());

    // ===== Init =====
    loadOrders(true);
  </script>
</body>
</html>
